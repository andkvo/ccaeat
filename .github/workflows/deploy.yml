name: Deploy PWA to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC-based AWS auth (if used)
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      DEPLOY_READY: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.S3_BUCKET != '' && secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Check deployment configuration
        if: env.DEPLOY_READY != 'true'
        run: |
          echo "::warning::Skipping S3/CloudFront deploy because required GitHub Actions secrets are missing."
          echo "::warning::Set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, and CLOUDFRONT_DISTRIBUTION_ID. Set AWS_REGION as a repository variable or secret if the bucket is not in ${AWS_REGION}."

      - name: Configure AWS credentials
        if: env.DEPLOY_READY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        if: env.DEPLOY_READY == 'true'
        run: |
          # Expo outputs to dist/ and generates content-hashed filenames for
          # JS/CSS bundles, so a long max-age is safe for all assets except
          # index.html and the service worker (which are not content-hashed).
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "sw.js"
          # index.html and service worker must not be cached long-term
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          if [ -f dist/sw.js ]; then
            aws s3 cp dist/sw.js s3://${{ secrets.S3_BUCKET }}/sw.js \
              --cache-control "no-cache, no-store, must-revalidate"
          fi

      - name: Invalidate CloudFront cache
        if: env.DEPLOY_READY == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/sw.js"
